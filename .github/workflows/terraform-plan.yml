name: Terraform plan

on:
  workflow_call:
    inputs:
      terraform_version:
        type: string
        required: false
        default: "1.9.8"
      working_directory:
        type: string
        required: false
        default: "."
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true
      TF_STATE_BUCKET:
        required: true
      TF_VAR_project_id:
        required: true
      TF_VAR_bucket_name:
        required: true
      TF_VAR_region:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET is required"; exit 1; }
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=terraform-google-gcs/basic"
      - name: Terraform plan
        env:
          TF_VAR_project_id: ${{ secrets.TF_VAR_project_id }}
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_bucket_name }}
          TF_VAR_region: ${{ secrets.TF_VAR_region }}
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Upload reviewed plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 1
          if-no-files-found: error
